# Puts the Hostinger site (the PHP dashboard and the price API) on the real
# server whenever those files change on main, so "git push" is the deploy.
# It uploads only the files that changed and never touches api/config.php,
# the cache, or anything else already on the server.
#
# Setup, once, on GitHub: repository > Settings > Secrets and variables >
# Actions > New repository secret:
#   FTP_SERVER    the FTP host from hPanel > Files > FTP Accounts (name or IP, no ftp://)
#   FTP_USERNAME  the FTP account's user name
#   FTP_PASSWORD  its password
# Optional repository variables (same page, "Variables" tab):
#   FTP_SERVER_DIR  folder on the server to upload into; default "./" (use an
#                   FTP account whose directory is the site's public_html)
#   FTP_PROTOCOL    "ftps" (default, encrypted) or "ftp" if the host refuses TLS
#   SITE_URL        default https://scrape.gofix.info
#
# Run it by hand any time: Actions tab > "Deploy site to Hostinger" > Run workflow.
name: Deploy site to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "hostinger_site/**"
      - "hostinger_api/**"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

# One deploy at a time; a second push waits for the first to finish.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://scrape.gofix.info' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to this repository (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Deploying to $FTP_SERVER as $FTP_USERNAME"

      # The server's public_html layout: the site at the root, the API in api/.
      - name: Assemble the files for public_html
        run: |
          mkdir -p deploy/api
          cp hostinger_site/index.php hostinger_site/.htaccess deploy/
          cp -r hostinger_site/php hostinger_site/public deploy/
          rm -rf deploy/php/cache
          cp hostinger_api/index.php hostinger_api/.htaccess hostinger_api/config.example.php hostinger_api/SETUP.txt deploy/api/
          echo "Files to upload:"
          find deploy -type f | sort

      - name: Upload the changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .spareprice-deploy-state.json
          exclude: |
            **/config.php
            **/cache/**

      - name: Check the live site answers
        run: |
          echo "API health:"
          curl -fsS "$SITE_URL/api/health"
          echo
          curl -fsS -o /tmp/page.html -w "Dashboard: HTTP %{http_code}\n" "$SITE_URL/"
          grep -q "Spare Part Price Dashboard" /tmp/page.html && echo "Dashboard page renders"
